name: Publish ICS calendars

on:
  push:
    branches:
      - main
      - master
    paths:
      - "data/**"
      - "generate_ics.py"
      - "requirements.txt"
      - ".github/workflows/publish.yml"
  workflow_dispatch: {}
  schedule:
    - cron: "10 8 1 * *"

permissions:
  contents: write

concurrency:
  group: publish-ics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate ICS
        run: python generate_ics.py --start 2024 --end 2028 --out out

      - name: Commit updated ICS
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh calendar ics [skip ci]"
          file_pattern: "out/*.ics"
          skip_fetch: true
          skip_checkout: true
